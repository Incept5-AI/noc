name: NOC

# Generated with `xcodegen generate`. The .xcodeproj is NOT checked in — this spec is the
# source of truth.

options:
  bundleIdPrefix: com.incept5
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID here (or pick it in Xcode)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  NOC:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incept5.noc
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: NOC
    sources:
      - path: NOC
    info:
      path: NOC/Info.plist
      properties:
        CFBundleDisplayName: NOC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # http to a local dev collector (uvicorn noc_web:app); public hosts stay HTTPS-only
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}

  # UI smoke tests against a live collector. Needs a session token, passed through the runner:
  #   TEST_RUNNER_NOC_TOKEN=<session> [TEST_RUNNER_NOC_BASE=https://…] xcodebuild test -scheme NOC …
  NOCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NOCUITests
    dependencies:
      - target: NOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.incept5.noc.uitests
        TEST_TARGET_NAME: NOC
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NOC:
    build:
      targets:
        NOC: all
        NOCUITests: [test]
    test:
      targets: [NOCUITests]
